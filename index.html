<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#183b34" />
  <title>夜市守卫：无尽开打</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar" aria-label="游戏信息">
      <a class="brand" href="#" aria-label="夜市守卫首页"><span class="brand-mark">夜</span><span>夜市守卫</span></a>
      <div class="run-stats">
        <div class="stat"><span>坚持</span><strong id="timeStat">00:00</strong></div>
        <div class="stat"><span>波次</span><strong id="waveStat">1</strong></div>
        <div class="stat"><span>击退</span><strong id="killStat">0</strong></div>
      </div>
      <button class="sound-button" id="soundButton" aria-label="关闭音效" title="音效开关">♫</button>
    </header>
    <section class="arena-wrap" aria-label="游戏区域">
      <div class="arena-topline">
        <div class="hero-status"><span class="hero-name">奶团龙</span><span class="status-divider"></span><span id="levelText">Lv. 1</span></div>
        <div class="health-hud" aria-label="角色生命">
          <span class="hp-count" id="hpCount">4 / 4</span>
          <div class="hearts" id="hearts" aria-label="生命值"></div>
        </div>
      </div>
      <canvas id="gameCanvas" width="960" height="600" aria-label="夜市打怪游戏画面"></canvas>
      <div class="arena-bottomline">
        <div class="xp-track" aria-label="经验值"><span id="xpFill"></span></div>
        <span class="xp-label" id="xpLabel">经验 0 / 6</span>
        <span class="arena-tip" id="arenaTip">移动躲避 · 自动攻击最近的敌人</span>
      </div>
      <div class="boss-hud hidden" id="bossHud"><span>今晚的催单王</span><div class="boss-track"><i id="bossFill"></i></div></div>
      <div class="joystick" id="joystick" role="application" aria-label="移动摇杆">
        <span class="joystick-ring"></span>
        <span class="joystick-knob" id="joystickKnob"></span>
      </div>
    </section>
    <footer class="controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动</span>
      <span><kbd>空格</kbd> 冲刺 <span class="control-sep">·</span> 手机：移动摇杆</span>
      <span class="record">最高纪录 <strong id="bestStat">00:00</strong></span>
    </footer>
  </main>
  <div class="overlay" id="startOverlay">
    <div class="intro-card">
      <div class="mascot-pair" aria-hidden="true"><span class="mascot dragon">团</span><span class="mascot mouse">急</span><span class="sparkle">✦</span></div>
      <p class="eyebrow">夜市今晚不打烊</p>
      <h1>无尽开打</h1>
      <p class="intro-copy">奶团龙误入深夜夜市，催单鼠和泡泡怪一波接一波。<br />走位、集经验、选强化——看看你能撑到第几波。</p>
      <div class="feature-row"><span>自动攻击</span><span>每 5 波首领</span><span>随机升级</span></div>
      <button class="primary-button" id="startButton">开打 <span>↗</span></button>
      <p class="original-note">原创街机角色 · 方向键移动 · 空格冲刺</p>
    </div>
  </div>
  <div class="overlay hidden" id="upgradeOverlay" aria-modal="true" role="dialog" aria-labelledby="upgradeTitle">
    <div class="upgrade-panel">
      <p class="eyebrow">夜市补给</p><h2 id="upgradeTitle">挑一个强化</h2>
      <p class="upgrade-subtitle">每次升级选一项，越往后越难。</p>
      <div class="upgrade-options" id="upgradeOptions"></div>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <div class="intro-card result-card">
      <p class="eyebrow">摊主收摊了</p><h1>这波没撑住</h1>
      <p class="intro-copy" id="resultText"></p>
      <div class="result-stats"><span>击退 <strong id="resultKills">0</strong></span><span>到达 <strong id="resultWave">第 1 波</strong></span></div>
      <button class="primary-button" id="retryButton">再来一局 <span>↗</span></button>
    </div>
  </div>
  <button class="mobile-dash" id="dashButton" aria-label="冲刺">冲刺</button>
  <script src="game.js"></script>
</body>
</html>
